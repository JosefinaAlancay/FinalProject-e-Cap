<!-- Encabezado de resultados -->
<div class="container-fluid border-bottom px-2 px-lg-4 pb-3 mb-4">
    <div class="container-fluid border-bottom px-2 px-lg-4 pb-3 mb-4">
        <div
            class="d-flex flex-column flex-md-row justify-content-between align-items-start align-items-md-center gap-3">
            <div class="text-muted small">
                Mostrando <strong>{{ paginatedCourses.length }}</strong> de
                <strong>{{ filteredCourses.length }}</strong> resultados
            </div>

            <div class="d-flex align-items-center gap-3 flex-wrap">
                <!-- Botones de vista -->
                <div class="btn-group" role="group" aria-label="Toggle view mode">
                    <button type="button" class="btn btn-outline-success btn-sm" [class.active]="viewMode === 'grid'"
                        (click)="setView('grid')" aria-label="Vista de grilla" style="--bs-btn-hover-bg: #15CF7433;">
                        <i class="bi bi-grid-fill" [style.color]="viewMode === 'grid' ? '#15CF74' : ''"></i>
                    </button>
                    <button type="button" class="btn btn-outline-success btn-sm" [class.active]="viewMode === 'list'"
                        (click)="setView('list')" aria-label="Vista de lista" style="--bs-btn-hover-bg: #15CF7433;">
                        <i class="bi bi-list" [style.color]="viewMode === 'list' ? '#15CF74' : ''"></i>
                    </button>
                </div>

                <!-- Ordenamiento -->
                <select class="form-select form-select-sm border-1 border-success-subtle text-dark"
                    style="min-width: 180px; background-color: #f9f9f9; border-radius: 0.5rem;" [(ngModel)]="sortOption"
                    (change)="onSortChange()">
                    <option value="new">Ordenar por: Nuevos</option>
                    <option value="priceLow">Precio: menor a mayor</option>
                    <option value="priceHigh">Precio: mayor a menor</option>
                </select>
            </div>
        </div>
    </div>

    <!-- Contenedor principal -->
    <div class="container-fluid py-3">
        <div class="row">
            <!-- Sidebar -->
            <aside class="col-lg-3 mb-4">
                <div class="bg-white shadow-sm rounded-4 p-4 border">
                    <!-- Buscador -->
                    <div class="mb-4">
                        <label for="searchInput" class="form-label fw-semibold">Buscar curso</label>
                        <div class="input-group">
                            <input type="text" id="searchInput" class="form-control form-control-sm rounded-start-3"
                                placeholder="Buscar por título..." [(ngModel)]="searchTerm"
                                (input)="onSearchChange()" />
                            <span class="input-group-text bg-white rounded-end-3">
                                <i class="bi bi-search text-muted"></i>
                            </span>
                        </div>
                    </div>

                    <hr class="my-4" />

                    <!-- Filtros -->
                    <h5 class="fw-semibold mb-4">Filtrar cursos</h5>

                    <!-- Categorías -->
                    <div class="mb-4">
                        <h6 class="text-muted small mb-2 text-uppercase">Categoría</h6>
                        <div *ngFor="let cat of categories" class="form-check small mb-2">
                            <input class="form-check-input" type="checkbox" [value]="cat.id"
                                (change)="onCategoryChange($event)" style="accent-color: #15CF74;" />
                            <label class="form-check-label text-dark">{{ cat.name }}</label>
                        </div>
                    </div>

                    <!-- Niveles -->
                    <div>
                        <h6 class="text-muted small mb-2 text-uppercase">Nivel</h6>
                        <div *ngFor="let lvl of levels" class="form-check small mb-2">
                            <input class="form-check-input" type="checkbox" [value]="lvl"
                                (change)="onLevelChange($event)" style="accent-color: #15CF74;" />
                            <label class="form-check-label text-dark">{{ lvl }}</label>
                        </div>
                    </div>
                </div>
            </aside>


            <!-- Card de cursos -->
            <section class="col-lg-9">
                <div class="row g-4">
                    <ng-container *ngIf="filteredCourses.length > 0; else noResults">
                        <div class="col-md-6 col-lg-4" *ngFor="let course of paginatedCourses">
                            <app-course-card [course]="course"></app-course-card>
                        </div>
                    </ng-container>

                    <!-- Sin resultados -->
                    <ng-template #noResults>
                        <div class="col-12 text-center py-5 text-muted">
                            <i class="bi bi-emoji-frown fs-1 d-block mb-3"></i>
                            <h5>No se encontraron cursos con los filtros seleccionados</h5>
                        </div>
                    </ng-template>
                </div>

                <!-- Paginación -->
                <nav class="d-flex justify-content-center mt-5" *ngIf="totalPages > 1">
                    <ul class="pagination pagination-sm mb-0" style="gap: 0.4rem;">

                        <!-- Anterior -->
                        <li class="page-item" [class.disabled]="currentPage === 1">
                            <button
                                class="page-link border-0 rounded-circle d-flex align-items-center justify-content-center shadow-sm"
                                style="width: 36px; height: 36px; background-color: #f8f9fa;"
                                (click)="changePage(currentPage - 1)" [attr.aria-label]="'Anterior'">
                                <i class="bi bi-chevron-left text-success" style="color: #15CF74;"></i>
                            </button>
                        </li>

                        <!-- Número de página -->
                        <li class="page-item" *ngFor="let page of [].constructor(totalPages); let i = index"
                            [class.active]="currentPage === i + 1">
                            <button class="page-link border-0 rounded-circle fw-semibold shadow-sm"
                                (click)="changePage(i + 1)" [ngStyle]="{
          backgroundColor: currentPage === i + 1 ? '#15CF74' : '#f0f0f0',
          color: currentPage === i + 1 ? '#fff' : '#212529',
          width: '36px',
          height: '36px',
          display: 'flex',
          alignItems: 'center',
          justifyContent: 'center'
        }" [attr.aria-label]="'Página ' + (i + 1)">
                                {{ i + 1 }}
                            </button>
                        </li>

                        <!-- Siguiente-->
                        <li class="page-item" [class.disabled]="currentPage === totalPages">
                            <button
                                class="page-link border-0 rounded-circle d-flex align-items-center justify-content-center shadow-sm"
                                style="width: 36px; height: 36px; background-color: #f8f9fa;"
                                (click)="changePage(currentPage + 1)" [attr.aria-label]="'Siguiente'">
                                <i class="bi bi-chevron-right text-success" style="color: #15CF74;"></i>
                            </button>
                        </li>
                    </ul>
                </nav>


            </section>
        </div>
    </div>
