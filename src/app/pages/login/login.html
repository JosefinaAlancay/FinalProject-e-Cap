<div class="container-fluid vh-100 d-flex align-items-center justify-content-center bg-light">
  <div class="row w-100 shadow rounded overflow-hidden" style="max-width: 900px;">

    <!-- Formulario -->
    <div class="col-md-6 bg-white p-5 d-flex flex-column justify-content-center">
      <!-- Logo -->
      <div class="mb-4 d-flex d-grid gap-3 align-items-center">
        <i [routerLink]="'/'" style="color: #15CF74;" class="bi bi-arrow-left-circle-fill fs-3 icon-hover"></i>
        <h6 class="mb-0 fw-bolder">Regresar</h6>
      </div>

      <!-- Título -->
      <h3 class="fw-bold">Bienvenido/a <span>👋</span></h3>
      <p class="text-muted mb-4">Completa los datos para continuar :)</p>

      <!-- Formulario -->
      <form>
        <div class="mb-3">
          <label class="form-label">Email</label>
          <input type="email" class="form-control" placeholder="example@example.com" required>
        </div>

        <div class="mb-4">
          <label class="form-label">Contraseña</label>
          <div class="input-group">
            <input type="password" class="form-control" placeholder="************" required>
            <span class="input-group-text bg-white"><i class="bi bi-eye-slash"></i></span>
          </div>
        </div>

        <button type="submit" class="rounded w-100" style="background-color: #15CF74; color: white;">Ingresar</button>
      </form>
    </div>

    <!-- Imagen lateral -->
    <div class="col-md-6 d-none d-md-block p-0">
      <img src="https://images.pexels.com/photos/4778667/pexels-photo-4778667.jpeg" alt="Login image" class="img-fluid h-100 w-100 object-fit-cover" style="object-fit: cover; border-top-right-radius: 10px; border-bottom-right-radius: 10px;">
    </div>

  </div>
</div>
