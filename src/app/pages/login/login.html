<div class="container-fluid vh-100 d-flex align-items-center justify-content-center bg-light">
  <div class="row w-100 shadow rounded overflow-hidden" style="max-width: 900px;">

    <!-- Formulario -->
    <div class="col-md-6 bg-white p-5 d-flex flex-column justify-content-center">
      <!-- Logo -->
      <div class="mb-4 text-center">
        <img src="assets/img/logo.svg" alt="Logo" width="40" class="mb-2">
        <h6 class="mb-0">Logo</h6>
      </div>

      <!-- Título -->
      <h3 class="fw-bold">Welcome to AppUser <span>👋</span></h3>
      <p class="text-muted mb-4">Kindly fill in your details below to continue</p>

      <!-- Formulario -->
      <form>
        <div class="mb-3">
          <label class="form-label">Email Address</label>
          <input type="email" class="form-control" placeholder="faizan@apps" required>
        </div>

        <div class="mb-4">
          <label class="form-label">Password</label>
          <div class="input-group">
            <input type="password" class="form-control" placeholder="************" required>
            <span class="input-group-text bg-white"><i class="fa fa-eye-slash"></i></span>
          </div>
        </div>

        <button type="submit" class="btn btn-success w-100">Login</button>
      </form>
    </div>

    <!-- Imagen lateral -->
    <div class="col-md-6 d-none d-md-block p-0">
      <img src="assets/img/login-img.jpg" alt="Login image" class="img-fluid h-100 w-100 object-fit-cover" style="object-fit: cover; border-top-right-radius: 10px; border-bottom-right-radius: 10px;">
    </div>

  </div>
</div>
